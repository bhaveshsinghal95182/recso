
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name    = "velocity"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
napi = { version = "3.0.0", features = ["napi6"] }
napi-derive = "3.0.0"
rcgen = { version = "0.14.10", default-features = false, features = [
  "pem",
  "ring",
] }
serde_json = "1.0"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.49.0", features = ["rt", "macros"] }

# Capture, engine and audio are built on Windows APIs; on other platforms the
# crate compiles without them (see the cfg(windows) gates in src/).
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10", features = ["input-msmf"] }
wasapi = "0.23.0"
windows = { version = "0.62.2", features = [
  # capture / cursor / window
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  # engine: D3D11 device, shared textures, shader compilation
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # engine: Media Foundation decode / encode
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Performance",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  # capture: asking Windows to drop the yellow capture border
  "Graphics_Capture",
  "Security_Authorization_AppCapabilityAccess",
] }
windows-capture = "2.0.0"

# Linux capture: the xdg-desktop-portal grants a PipeWire stream, frames are
# encoded to H.264 and muxed to MP4. All permissively licensed -- nothing
# copyleft may ship in the product (docs/linux-port.md).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = [
  "tokio",
  "screencast",
] }
# Demuxes recordings for the Linux engine's decode, probe and thumbnails.
mp4      = "0.14"
openh264 = "0.9"
# Loads the NVIDIA driver libraries (libcuda, libnvidia-encode) at runtime for NVENC.
libloading = "0.8"
# The system libopus (BSD), linked dynamically; the bundled build needs cmake.
opusic-sys = { version = "0.7", default-features = false }
pipewire   = "0.10"
# Webcams through the kernel's V4L2 interface. Not the `libv4l` feature:
# that wraps the LGPL libv4l.
v4l = { version = "0.14", default-features = false, features = ["v4l2"] }
# `clock_gettime`, to place V4L2's monotonic capture timestamps on `Instant`'s clock.
libc = "0.2"
# Preview frames reach Electron as DMA-BUFs allocated through GBM (libgbm, MIT).
gbm = { version = "0.18", default-features = false }
# The Linux engine's render chain: the D3D11 shaders ported to WGSL.
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
wgpu     = "30"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
