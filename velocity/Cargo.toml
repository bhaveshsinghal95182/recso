
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name    = "velocity"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi            = { version = "3.0.0", features = ["napi4"] }
napi-derive     = "3.0.0"
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"
splines         = "5.0.0"
windows-capture = "1.5"

  [dependencies.windows]
  features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
  ]
  version = "0.58"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
