
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name    = "velocity"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"
tokio = { version = "1.49.0", features = ["rt", "macros"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
] }
windows-capture = "1.5.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
