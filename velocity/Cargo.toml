
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name    = "velocity"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
] }
napi = { version = "3.0.0", features = ["napi6"] }
napi-derive = "3.0.0"
nokhwa = { version = "0.10", features = ["input-msmf"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["rt", "macros"] }
wasapi = "0.23.0"
windows = { version = "0.62.2", features = [
  # capture / cursor / window
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  # engine: D3D11 device, shared textures, shader compilation
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  # engine: Media Foundation decode / encode
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  # capture: asking Windows to drop the yellow capture border
  "Graphics_Capture",
  "Security_Authorization_AppCapabilityAccess",
] }
windows-capture = "2.0.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto   = true
strip = "symbols"
