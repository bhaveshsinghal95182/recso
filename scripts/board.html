<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>recso board</title>
    <style>
      :root {
        --bg: #f7f7f8;
        --panel: #ffffff;
        --card: #ffffff;
        --line: #e3e3e6;
        --ink: #1b1b1f;
        --dim: #74747c;
        --accent: #4f46e5;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 1px 3px rgb(0 0 0 / 0.04);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121215;
          --panel: #18181c;
          --card: #1f1f24;
          --line: #2c2c33;
          --ink: #ececf0;
          --dim: #8b8b95;
          --accent: #818cf8;
          --shadow: none;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 ui-sans-serif,
          -apple-system,
          'Segoe UI',
          system-ui,
          sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      header .hint {
        color: var(--dim);
        font-size: 12px;
        margin-left: auto;
      }

      #quick {
        flex: 1;
        max-width: 420px;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }

      #quick:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      #board {
        flex: 1;
        display: flex;
        gap: 14px;
        padding: 16px 20px 20px;
        overflow-x: auto;
        /* Columns stretch to full height and scroll internally, rather than
           shrink-wrapping and getting clipped by the viewport. It also makes an
           empty column a full-height drop target, which is the one that most
           needs to be easy to hit. */
        align-items: stretch;
        min-height: 0;
      }

      .col {
        flex: 0 0 320px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .col.over {
        border-color: var(--accent);
      }

      .col > h2 {
        margin: 0;
        padding: 12px 14px 10px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--dim);
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .col > h2 .count {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 1px 7px;
        font-size: 11px;
      }

      .col > h2 button {
        margin-left: auto;
        background: none;
        border: none;
        color: var(--dim);
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        padding: 0 2px;
      }

      .col > h2 button:hover {
        color: var(--ink);
      }

      .cards {
        padding: 0 10px 10px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 44px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 11px;
        cursor: grab;
        box-shadow: var(--shadow);
      }

      .card:active {
        cursor: grabbing;
      }

      .card.dragging {
        opacity: 0.35;
      }

      .card .title {
        font-weight: 500;
        letter-spacing: -0.005em;
      }

      .card .body {
        color: var(--dim);
        font-size: 12.5px;
        margin-top: 5px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 7px;
      }

      .tag {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 20px;
        border: 1px solid currentColor;
        opacity: 0.85;
      }

      .empty {
        color: var(--dim);
        font-size: 12.5px;
        font-style: italic;
        padding: 4px 2px 8px;
      }

      .editor {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--card);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 11px;
      }

      .editor input,
      .editor textarea {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }

      .editor textarea {
        min-height: 110px;
        resize: vertical;
        font-size: 13px;
      }

      .editor .row {
        display: flex;
        gap: 7px;
        align-items: center;
      }

      .editor button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      .editor button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .editor button.danger {
        margin-left: auto;
        color: #dc2626;
      }

      #toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 9px 16px;
        border-radius: 7px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
      }

      #toast.show {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>recso board</h1>
      <input id="quick" placeholder="File a card in Inbox, then Enter&hellip;  (#tag to tag it)" />
      <span class="hint">board.md &middot; drag to move &middot; click to edit</span>
    </header>

    <div id="board"></div>
    <div id="toast"></div>

    <script>
      // The board is a view over board.md. Every mutation rewrites the whole
      // file, guarded by a content hash so a hand-edit in your editor is not
      // silently clobbered by a drag in here.
      let board = null;
      let editing = null; // { col, idx } | { col, idx: -1 } for a new card

      const el = (id) => document.getElementById(id);

      // Known kinds get a fixed hue so a bug always reads the same colour.
      // Everything else is derived, which keeps ad-hoc tags distinguishable
      // without needing a registry nobody would maintain.
      const HUES = {
        bug: 0,
        wontfix: 20,
        perf: 32,
        chore: 48,
        known: 60,
        docs: 200,
        feature: 215,
        gap: 265,
        security: 340,
        big: 285,
      };

      function hue(tag) {
        if (tag in HUES) return HUES[tag];
        let h = 0;
        for (const ch of tag) h = (h * 31 + ch.charCodeAt(0)) % 360;
        return h;
      }

      const esc = (s) =>
        s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      function toast(msg) {
        const t = el('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
      }

      async function load() {
        const res = await fetch('/api/board');
        board = await res.json();
        editing = null;
        render();
      }

      async function save() {
        const res = await fetch('/api/board', {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(board),
        });

        if (res.status === 409) {
          toast('board.md changed on disk — reloading');
          return load();
        }

        if (!res.ok) return toast('save failed');
        board.hash = (await res.json()).hash;
      }

      // ------------------------------------------------------------ render

      function render() {
        const root = el('board');
        root.innerHTML = '';

        board.columns.forEach((col, ci) => {
          const node = document.createElement('section');
          node.className = 'col';
          node.dataset.col = ci;

          const head = document.createElement('h2');
          head.innerHTML = `${esc(col.name)} <span class="count">${col.cards.length}</span>`;
          const add = document.createElement('button');
          add.textContent = '+';
          add.title = `New card in ${col.name}`;
          add.onclick = () => {
            editing = { col: ci, idx: -1 };
            render();
          };
          head.appendChild(add);
          node.appendChild(head);

          const cards = document.createElement('div');
          cards.className = 'cards';

          if (editing && editing.col === ci && editing.idx === -1) {
            cards.appendChild(cardEditor(ci, -1, { title: '', tags: [], body: '' }));
          }

          if (!col.cards.length && !(editing && editing.col === ci)) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'nothing here';
            cards.appendChild(empty);
          }

          col.cards.forEach((card, i) => {
            if (editing && editing.col === ci && editing.idx === i) {
              cards.appendChild(cardEditor(ci, i, card));
            } else {
              cards.appendChild(cardView(ci, i, card));
            }
          });

          // Dropping anywhere in the column appends; dropping on a card
          // inserts before it. Good enough, and it means an empty column is
          // still a valid target.
          node.ondragover = (e) => {
            e.preventDefault();
            node.classList.add('over');
          };
          node.ondragleave = () => node.classList.remove('over');
          node.ondrop = (e) => {
            e.preventDefault();
            node.classList.remove('over');
            drop(ci, col.cards.length);
          };

          node.appendChild(cards);
          root.appendChild(node);
        });
      }

      function cardView(ci, i, card) {
        const node = document.createElement('article');
        node.className = 'card';
        node.draggable = true;

        const tags = card.tags
          .map((t) => `<span class="tag" style="color:hsl(${hue(t)} 62% 52%)">${esc(t)}</span>`)
          .join('');

        node.innerHTML =
          `<div class="title">${esc(card.title)}</div>` +
          // The preview strips code fencing so a three-line summary reads as
          // prose. The editor still shows the markdown source, which is what
          // the file actually holds.
          (card.body ? `<div class="body">${esc(card.body.replace(/`/g, ''))}</div>` : '') +
          (tags ? `<div class="tags">${tags}</div>` : '');

        node.onclick = () => {
          editing = { col: ci, idx: i };
          render();
        };

        node.ondragstart = (e) => {
          dragging = { col: ci, idx: i };
          node.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          // Firefox refuses to start a drag without payload.
          e.dataTransfer.setData('text/plain', card.title);
        };
        node.ondragend = () => node.classList.remove('dragging');

        node.ondragover = (e) => {
          e.preventDefault();
          e.stopPropagation();
        };
        node.ondrop = (e) => {
          e.preventDefault();
          e.stopPropagation();
          drop(ci, i);
        };

        return node;
      }

      function cardEditor(ci, idx, card) {
        const node = document.createElement('div');
        node.className = 'editor';
        node.onclick = (e) => e.stopPropagation();

        const title = document.createElement('input');
        title.value = card.title;
        title.placeholder = 'Title';

        const tags = document.createElement('input');
        tags.value = card.tags.join(', ');
        tags.placeholder = 'tags, comma separated';

        const body = document.createElement('textarea');
        body.value = card.body;
        body.placeholder = 'What is actually wrong, or what needs building.';

        const row = document.createElement('div');
        row.className = 'row';

        const ok = document.createElement('button');
        ok.className = 'primary';
        ok.textContent = 'Save';
        ok.onclick = async () => {
          const next = {
            title: title.value.trim(),
            tags: tags.value
              .split(',')
              .map((t) => t.trim())
              .filter(Boolean),
            body: body.value.trim(),
          };
          if (!next.title) return title.focus();

          if (idx === -1) board.columns[ci].cards.unshift(next);
          else board.columns[ci].cards[idx] = next;

          editing = null;
          render();
          await save();
        };

        const cancel = document.createElement('button');
        cancel.textContent = 'Cancel';
        cancel.onclick = () => {
          editing = null;
          render();
        };

        row.append(ok, cancel);

        if (idx !== -1) {
          const del = document.createElement('button');
          del.className = 'danger';
          del.textContent = 'Delete';
          del.onclick = async () => {
            board.columns[ci].cards.splice(idx, 1);
            editing = null;
            render();
            await save();
          };
          row.appendChild(del);
        }

        // Ctrl/Cmd+Enter saves from anywhere in the editor.
        node.onkeydown = (e) => {
          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ok.click();
          if (e.key === 'Escape') cancel.click();
        };

        node.append(title, tags, body, row);
        setTimeout(() => title.focus(), 0);
        return node;
      }

      // ------------------------------------------------------------ drag

      let dragging = null;

      async function drop(toCol, toIdx) {
        if (!dragging) return;
        const { col: fromCol, idx: fromIdx } = dragging;
        dragging = null;

        const [card] = board.columns[fromCol].cards.splice(fromIdx, 1);
        // Removing from an earlier position in the same column shifts the
        // target left by one; without this a card dragged down lands one
        // slot short of where it was dropped.
        if (fromCol === toCol && fromIdx < toIdx) toIdx -= 1;
        board.columns[toCol].cards.splice(toIdx, 0, card);

        render();
        await save();
      }

      // ------------------------------------------------------------ quick add

      el('quick').addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        const raw = e.target.value.trim();
        if (!raw) return;

        // `#tag` anywhere in the line becomes a tag and leaves the title.
        const tags = [...raw.matchAll(/#([\w-]+)/g)].map((m) => m[1]);
        const title = raw
          .replace(/#[\w-]+/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        if (!title) return;

        const inbox = board.columns.find((c) => /inbox/i.test(c.name)) ?? board.columns[0];
        inbox.cards.unshift({ title, tags, body: '' });

        e.target.value = '';
        render();
        await save();
        toast(`filed in ${inbox.name}`);
      });

      load();
    </script>
  </body>
</html>
