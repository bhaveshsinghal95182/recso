packages:
  - velocity

# pnpm 11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with allowBuilds.
# better-sqlite3 (and ffmpeg-static, when present) may run install scripts, and so
# may electron, whose script downloads the Electron binary that `electron .` and
# the export checks run. Everything else is ignored and relies on the prebuilt
# binaries it ships.
allowBuilds:
  better-sqlite3: true
  ffmpeg-static: true
  electron: true
  electron-winstaller: false
  esbuild: false
  sharp: false
  uiohook-napi: false
